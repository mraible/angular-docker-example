<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img
        src="/angular.svg"
        width="30"
        height="30"
        class="d-inline-block align-top"
        alt="Angular"
      />
      {{ title() }}
    </a>
    <button
      (click)="isCollapsed.set(!isCollapsed())"
      class="navbar-toggler"
      type="button"
      aria-controls="navbarSupportedContent"
      [attr.aria-expanded]="!isCollapsed()"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div [ngbCollapse]="isCollapsed()" class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://twitter.com/mraible">@mraible</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://github.com/mraible">GitHub</a>
        </li>
      </ul>
      <div class="d-flex">
        @if (auth.isAuthenticated()) {
          <button
            (click)="auth.logout()"
            type="button"
            class="btn btn-outline-secondary"
            id="logout"
          >
            Logout
          </button>
        } @else {
          <button (click)="auth.login()" type="button" class="btn btn-outline-primary" id="login">
            Login
          </button>
        }
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid pt-3">
  @if (!auth.isAuthenticated()) {
    <p>Please log in to manage your notes.</p>
  }
  <router-outlet />
</div>
