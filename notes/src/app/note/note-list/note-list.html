<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
    <li class="breadcrumb-item active">Notes</li>
  </ol>
</nav>
<h2>Notes List</h2>
<form (ngSubmit)="onSearch()" class="row g-2">
  <div class="col-auto">
    <input [(ngModel)]="filter.title" type="search" name="query" placeholder="Title" class="form-control" />
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-primary">Search</button>
    <a routerLink="/notes/new" class="btn btn-default ms-2">New</a>
  </div>
</form>
@if (feedback(); as feedback) {
  <div class="alert alert-{{ feedback.type }} mt-3">{{ feedback.message }}</div>
}
@if (notes().length > 0) {
  <div class="table-responsive">
    <table class="table table-centered table-hover mb-0" id="datatable">
      <thead>
        <tr>
          <th class="border-top-0" scope="col">Id</th>
          <th class="border-top-0" scope="col" sortable="title" (sort)="onSort($event)">Title</th>
          <th class="border-top-0" scope="col" sortable="text" (sort)="onSort($event)">Text</th>
          <th class="border-top-0" scope="col" style="width: 120px"></th>
        </tr>
      </thead>
      <tbody>
        @for (note of notes(); track note.id) {
          <tr>
            <td>{{ note.id }}</td>
            <td>{{ note.title }}</td>
            <td>{{ note.text }}</td>
            <td style="white-space: nowrap">
              <a [routerLink]="['/notes', note.id]" class="btn btn-secondary">Edit</a>&nbsp;
              <button (click)="delete(note)" class="btn btn-danger">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between p-2">
    <ngb-pagination
      [maxSize]="10"
      [collectionSize]="total()"
      [(page)]="page"
      [pageSize]="filter.size"
      (pageChange)="search()"
    />
    <select
      class="form-select"
      style="width: auto"
      name="pageSize"
      [(ngModel)]="filter.size"
      (ngModelChange)="onPageSizeChange()"
    >
      <option [ngValue]="10">10 items per page</option>
      <option [ngValue]="20">20 items per page</option>
      <option [ngValue]="100">100 items per page</option>
    </select>
  </div>
}
